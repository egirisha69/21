language: ru
comment: "Работа с базами данных и SQL"
introduction: |
  Этот проект является индивидуальным, поэтому выполняй его самостоятельно. Проверки в проекте очень важны:

  - Проверки — это не просто формальная сверка ответов с чек-листом, а важнейший этап обучения, где ты можешь обменяться опытом, обсудить сложности и сгенерировать новые подходы к решению. Этот механизм существенно влияет на динамику обучения.
  - Ты сможешь посмотреть на разные варианты решения проекта: проверяя проекты других участников, ты не просто оцениваешь проект, но и активно изучаешь и анализируешь другие варианты решения задачи, обогащая свой опыт.
  - Обсуждение способствует пониманию и усвоению: обсуждая проблемы и сложности в процессе проверки, ты не только сможешь выявить возможные недопонимания, но и с помощью совместного «мозгового штурма» добьёшься осознанного подхода к выполнению задания.
  - Задавай уточняющие вопросы, вступай в диалог с пирами. Даже если ты ещё не сделал проект, но уже проверяешь его у другого участника, не беспокойся! В таком случае проверяемый должен выступить в роли ментора и подробно объяснить свою работу. Это поможет ему увидеть своё решение с другой стороны и улучшить навыки самопрезентации, а тебе — лучше разобраться в теме.
  - Выявляя ошибки, исправляй их: при обсуждении ошибок не концентрируйся только на их выявлении; лучше ищи способы их исправления и улучшения качества будущих заданий.
  - Не забывай, что твоя главная задача — вести открытую коммуникацию, прислушиваться к тому, как мыслят и учатся другие. Пробуй вместе с другими пирами искать новые смыслы в той теории, которую ты изучил, объясняй остальным те моменты, которые понял лучше всего, делись инструментами, которые помогают тебе эффективно обучаться и познавать новую профессию. Главное — дружелюбие и открытость, ведь все вы идёте к одной цели.

guidelines: |
  - Подлежат оцениванию только те файлы, которые участник выложил в GIT-репозиторий в папку `src/` ветки `develop`.
  - Убедись в том, что ты ничего не перепутал, и репозиторий является репозиторием участника, которого ты проверяешь.
  - Если ты сам ещё не закончил работу над заданием, обязательно перечитай его ещё раз перед проверкой.
  - **EMPTY WORK** — поставь этот флаг, если репозиторий пустой, решение запушено не в папку `src/` ветки `develop`, либо ветка `develop` отсутствует. Продолжи проверку, чтобы помочь разобраться.
  - **CHEAT** — поставь этот флаг, если ты уверен, что участник не сам выполнил работу (например, не может объяснить решение). Продолжи проверку.

quick_actions:
  - EMPTY_WORK
  - CHEAT

sections:
  - kind: "main"
    name: "Основные задания проекта"
    description: "Все задания с 1 по 6"
    questions:
      - name: "Задание 1: Первый допрос"
        description: |
          **Цель:** научиться извлекать данные из одной таблицы с фильтрацией, сортировкой и ограничением.

          - В папке `src/` присутствует файл `task1.sql`.
          - Файл содержит ровно 5 запросов, каждый предварён комментарием `-- Вопрос N:`.
          - Вопрос 1: запрос фильтрует пациентов по значению `'Центральный'` в столбце `district` и сортирует результат по фамилии (`last_name ASC`).
          - Вопрос 2: запрос использует оба условия фильтрации (`status = 'Отменён'` AND `revenue > 3000`) в одном `WHERE`.
          - Вопрос 3: запрос использует `DISTINCT` для получения уникального списка городов.
          - Вопрос 4: запрос использует `ORDER BY wait_time_minutes DESC` и `LIMIT 10`.
          - Вопрос 5: запрос фильтрует по дате найма с условием `hire_date > '2020-01-01'`.

          **Вопрос для проверки понимания:**
          > «Чем отличается `WHERE` от `HAVING`? Почему `WHERE` нельзя использовать для фильтрации результата агрегатной функции, например `COUNT(*)`?»
        rating: "6"

      - name: "Задание 2: Паспорт специализации"
        description: |
          **Цель:** научиться использовать агрегатные функции, группировку и фильтрацию агрегатов.

          - В папке `src/` присутствует файл `task2.sql`.
          - Файл содержит ровно 5 запросов, каждый предварён комментарием `-- Вопрос N:`.
          - Вопрос 1: запрос использует `GROUP BY specialty_id` и фильтрует статус `'Проведён'` через `WHERE` (не через `HAVING`). Результат отсортирован по убыванию суммарной выручки.
          - Вопрос 2: запрос использует `HAVING AVG(revenue) > 4000` для фильтрации групп (а не `WHERE`).
          - Вопрос 3: запрос содержит `COUNT(DISTINCT patient_id)`, `MIN(revenue)`, `MAX(revenue)` и фильтр `HAVING COUNT(*) >= 10`.
          - Вопрос 4: запрос группирует по `branch_id` и использует `AVG(wait_time_minutes)`.
          - Вопрос 5: запрос вычисляет долю каждого статуса — участник использовал либо подзапрос, либо `CAST` для деления целых чисел.

          **Вопрос для проверки понимания:**
          > «Ты использовал `COUNT(*)` или `COUNT(column_name)`? В чём разница между ними, если в столбце встречаются значения `NULL`?»
        rating: "6"

      - name: "Задание 3: Архитектура связей"
        description: |
          **Цель:** научиться соединять таблицы разными типами JOIN и понимать их поведение.

          - В папке `src/` присутствует файл `task3.sql`.
          - Файл содержит ровно 5 запросов, каждый предварён комментарием `-- Вопрос N:`.
          - Вопрос 1: запрос соединяет как минимум 4 таблицы (`appointments`, `patients`, `doctors`, `specialties`) через `JOIN ... ON`.
          - Вопрос 2: запрос использует `LEFT JOIN` (appointments к doctors или наоборот) и показывает `0` или `NULL` для врачей без приёмов. Врачи без приёмов присутствуют в результате.
          - Вопрос 3: запрос использует `LEFT JOIN` так, что услуги без назначений отображаются с количеством `0`. Услуги 16, 17, 18 должны быть в результате.
          - Вопрос 4: запрос корректно реализует полное внешнее соединение — либо через `FULL OUTER JOIN` (SQLite ≥3.39), либо через `UNION` двух `LEFT JOIN`. В результате есть строки обоих типов с корректным столбцом `тип`.
          - Вопрос 5: запрос соединяет `branches` → `doctors` → `appointments` и использует `COALESCE` или `IFNULL` для замены `NULL` на `0` в суммарной выручке.

          **Вопрос для проверки понимания:**
          > «Что вернёт `LEFT JOIN`, если для строки из левой таблицы нет соответствия в правой? Покажи на своём примере с врачами без приёмов — что именно появляется в столбцах из правой таблицы?»
        rating: "6"

      - name: "Задание 4: Вложенный следователь"
        description: |
          **Цель:** научиться использовать подзапросы в разных позициях: `WHERE`, `FROM`, `SELECT`, коррелированные.

          - В папке `src/` присутствует файл `task4.sql`.
          - Файл содержит ровно 5 запросов, каждый предварён комментарием `-- Вопрос N:`.
          - Вопрос 1: запрос содержит подзапрос в `WHERE`, который вычисляет среднюю суммарную выручку по пациентам. Внешний запрос сравнивает суммарную выручку конкретного пациента с этим значением.
          - Вопрос 2: запрос содержит скалярный подзапрос в `SELECT`, который для каждого врача вычисляет суммарную выручку его специализации. Доля вычислена правильно (деление без потери дробной части).
          - Вопрос 3: запрос содержит подзапрос в `FROM` (производную таблицу с псевдонимом), который вычисляет среднюю выручку по услугам. Внешний запрос берёт топ-3.
          - Вопрос 4: запрос использует `IN` или `EXISTS` для нахождения пациентов с ≥2 разными специализациями.
          - Вопрос 5: запрос содержит коррелированный подзапрос — внутренний запрос ссылается на `doctor_id` из внешнего запроса. Последний месяц определён динамически, а не жёстко прописанной датой.

          **Вопрос для проверки понимания:**
          > «Объясни разницу между подзапросом в `WHERE` и подзапросом в `FROM`. Когда ты использовал каждый вариант и почему?»
        rating: "6"

      - name: "Задание 5: Хроники клиники"
        description: |
          **Цель:** научиться работать с датами в SQLite и строить условные вычисляемые столбцы.

          - В папке `src/` присутствует файл `task5.sql`.
          - Файл содержит ровно 5 запросов, каждый предварён комментарием `-- Вопрос N:`.
          - Вопрос 1: запрос использует `julianday('now')` и `julianday(birth_date)` для расчёта возраста в полных годах. Результат приведён к целому числу (`CAST ... AS INT` или деление на 365.25).
          - Вопрос 2: запрос содержит `CASE WHEN ... THEN ... ELSE ... END` с четырьмя ветками для возрастных групп. Группы непересекающиеся, граничные значения корректны.
          - Вопрос 3: запрос использует `strftime('%Y-%m', appointment_date)` для группировки по месяцам. Результат отсортирован хронологически.
          - Вопрос 4: запрос использует `CASE WHEN` с тремя ветками (`>60`, `>44 AND <=60`, `<45`) и выводит корректный `comfort_level` для каждого приёма.
          - Вопрос 5: запрос использует `strftime('%w', appointment_date)` для определения дня недели, фильтрует по статусу `'Отменён'`, группирует и находит максимум.

          **Вопрос для проверки понимания:**
          > «Почему для расчёта возраста нельзя просто вычесть годы: `strftime('%Y', 'now') - strftime('%Y', birth_date)`? Какой пограничный случай (edge case) такой подход упускает?»
        rating: "6"

      - name: "Задание 6: Оконный ревизор"
        description: |
          **Цель:** научиться использовать оконные функции для ранжирования, сдвига и накопления значений.

          - В папке `src/` присутствует файл `task6.sql`.
          - Файл содержит ровно 5 запросов, каждый предварён комментарием `-- Вопрос N:`.
          - Вопрос 1: запрос использует `ROW_NUMBER() OVER (PARTITION BY patient_id ORDER BY appointment_date)`. Внешний запрос или `WHERE` фильтрует только строки с номером `1`.
          - Вопрос 2: запрос использует `RANK()` с группировкой по специализации (`PARTITION BY specialty_id`) и сортировкой по суммарной выручке. В результате присутствуют строки с одинаковым рангом `1` (тай).
          - Вопрос 3: запрос использует `LAG(revenue) OVER (PARTITION BY doctor_id ORDER BY appointment_date)`. Разница вычислена. Для первого приёма врача предыдущая выручка — `NULL`.
          - Вопрос 4: запрос использует `SUM(revenue) OVER (PARTITION BY doctor_id ORDER BY appointment_date ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW)` — накопленная сумма не сбрасывается при каждой строке.
          - Вопрос 5: запрос использует `LEAD(appointment_date) OVER (PARTITION BY patient_id ORDER BY appointment_date)`. Интервал в днях вычислен через `julianday()`. Результат отфильтрован по условию интервала > 90 дней.

          **Вопрос для проверки понимания:**
          > «Чем `RANK()` отличается от `DENSE_RANK()`? Покажи на своём примере с рейтингом врачей — что произошло бы в строках после тая, если бы ты использовал `DENSE_RANK()` вместо `RANK()`?»
        rating: "6"
